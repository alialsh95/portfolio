    <script>
        // Professional Ultra-Smooth Drag / Touch Swipe Carousel Interactivity
        const sliderContainer = document.getElementById('clientsSliderContainer');
        const slider = document.getElementById('clientsSlider');
        
        let isDragging = false;
        let startPosX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        let animationFrameId;

        function getPositionX(event) {
            return event.type.includes('mouse') ? event.pageX : event.touches[0].clientX;
        }

        function touchStart(event) {
            isDragging = true;
            startPosX = getPositionX(event);
            slider.style.animationPlayState = 'paused';
            slider.style.transition = 'none';
        }

        function touchMove(event) {
            if (!isDragging) return;
            const currentPosition = getPositionX(event);
            const diff = currentPosition - startPosX;
            // Temporarily adjust container scroll position for smooth manual dragging
            sliderContainer.scrollLeft -= diff;
            startPosX = currentPosition;
        }

        function touchEnd() {
            if (!isDragging) return;
            isDragging = false;
            slider.style.animationPlayState = 'running';
        }

        // Mouse Events
        sliderContainer.addEventListener('mousedown', touchStart);
        sliderContainer.addEventListener('mousemove', touchMove);
        sliderContainer.addEventListener('mouseup', touchEnd);
        sliderContainer.addEventListener('mouseleave', touchEnd);

        // Touch Events for Mobile
        sliderContainer.addEventListener('touchstart', touchStart, { passive: true });
        sliderContainer.addEventListener('touchmove', touchMove, { passive: true });
        sliderContainer.addEventListener('touchend', touchEnd);
    </script>
